plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    // MRE (dev.sxmurxy.mre) — не публикуется в maven, лежит локально в libs/
    flatDir { dirs 'libs' }
    // Локальный maven-репо для MRE: include() (JiJ) требует модульный компонент
    // с GAV/capabilities, плоский files(...) Loom вкладывать отказывается.
    maven { url = uri("local-maven") }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "com.google.code.gson:gson:2.11.0"
    implementation "org.joml:joml:1.10.8"
    implementation "com.mojang:brigadier:1.3.10"

    // Вложенные jar'ы, поставляемые модом (в META-INF/jars), нужны как compile-зависимости
    compileOnly files('src/main/resources/META-INF/jars/media-player-info-0.1.0.jar')
    compileOnly files('src/main/resources/META-INF/jars/luaj-jse-3.0.1.jar')
    compileOnly files('src/main/resources/META-INF/jars/jlayer-1.0.1.jar')

    // MRE (dev.sxmurxy.mre) — та же сборка, что лежала внутри оригинального
    // astolfovisuals-2.0.jar (извлечена из него байт-в-байт). Публичная ветка
    // sxmurxy0/Minecraft-Render-Enhancer-2D-1.21 fabric-1.21.4 — СТАРЕЕ: в ней
    // нет Builder.liquidGlass() и MsdfFont.Builder.glyphMapper(), из-за чего
    // иконки ClickGUI и liquid-glass не работают.
    modImplementation "dev.sxmurxy:mre:1.0-1.21.4"
    // include() = JiJ: Loom вкладывает jar в META-INF/jars и прописывает в манифест.
    // Без этого MRE есть в dev-запуске (classpath), но отсутствует в собранном jar
    // → NoClassDefFoundError: dev/sxmurxy/mre/msdf/MsdfFont в обычном лаунчере.
    include "dev.sxmurxy:mre:1.0-1.21.4"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }